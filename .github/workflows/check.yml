name: check

# Every pull request to main: the plugin and marketplace manifests must validate, the scripts' tests must pass, and a
# change to the skill must come with a new version (see .github/scripts/release-guard.sh). Merging to main then
# releases it (release.yml).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the plugin and the marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.323 plugin validate . --strict
      - name: Script tests
        run: |
          python -m unittest discover -s tests -v
          node --check skills/figma-to-wordpress/scripts/check.mjs
          node --test tests/check.test.mjs
      - name: Release guard (a skill change needs a new version and its CHANGELOG section)
        run: sh .github/scripts/release-guard.sh "${{ github.event.pull_request.base.sha }}"
